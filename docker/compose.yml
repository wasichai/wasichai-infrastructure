name: wasichai

# local databases for the wasichai samples: `postgres` (PostGIS + pgvector) by default, `geoserver` with
# --profile gis, `postgres-plain` (no PostGIS, 5433) with --profile core. WASICHAI_PG_PORT moves postgres off 5432.
services:
  postgres:
    build:
      context: ./postgres
    image: wasichai/postgres:18-postgis-pgvector
    container_name: wasichai-postgres
    environment:
      POSTGRES_USER: wasichai
      POSTGRES_PASSWORD: wasichai
      POSTGRES_DB: wasichai
    ports:
      - "${WASICHAI_PG_PORT:-5432}:5432"
    volumes:
      # pg18 images want the mount one level up, data lands in a version subdir
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wasichai -d wasichai" ]
      interval: 5s
      timeout: 5s
      retries: 20

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.1
    container_name: wasichai-geoserver
    profiles: ['gis']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      SKIP_DEMO_DATA: "true"
      INSTALL_EXTENSIONS: "false"
      # the ui previews a published layer by pulling WMS tiles straight from here, which is a
      # different origin than the vite dev server. local development only; a deployment fronts both.
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"
    ports:
      - "8081:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data

  # core only: plain postgres, no postgis. proves the core does not need it.
  postgres-plain:
    image: postgres:18
    container_name: wasichai-postgres-plain
    profiles: ['core']
    environment:
      POSTGRES_USER: wasichai
      POSTGRES_PASSWORD: wasichai
      POSTGRES_DB: wasichai
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wasichai -d wasichai']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  geoserver-data:
